name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows (self-contained single-file)
        run: >
          dotnet publish Revv.Windows/Revv.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/windows

      - name: Zip Windows build
        run: Compress-Archive -Path publish\windows\* -DestinationPath Revv-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Revv-Windows-x64.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android APK
        run: dotnet build Revv/Revv.csproj -c Release -f net10.0-android

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Revv/bin/Release/net10.0-android/**/*.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/Revv-Windows-x64.zip
            artifacts/android/**/*.apk
